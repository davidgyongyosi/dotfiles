# ── Terminal ────────────────────────────────────────────────────────────────
# Programs inside tmux see tmux-256color; tell tmux the outer terminal
# (Ghostty) supports 24-bit color so Neovim themes render correctly.
set -g default-terminal 'tmux-256color'
set -ga terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'

# ── Options ─────────────────────────────────────────────────────────────────
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1        # same for panes, so prefix+q numbers match
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g mouse on                  # scroll, select and resize panes with the mouse
set -g focus-events on           # lets Neovim reload files changed outside it
set -g allow-passthrough on      # image/OSC passthrough (snacks.image, etc)
setw -g mode-keys vi

# ── Keys ────────────────────────────────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Reload this file.
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# Previous / next window, repeatable without pressing the prefix again.
bind -r p previous-window
bind -r n next-window

# Splits and new windows open in the current pane's directory.
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Resize panes with prefix + H/J/K/L (repeatable).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode: v to start a selection, C-v for block, y to yank.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Dev layout ──────────────────────────────────────────────────────────────
# New sessions inside ~/Projects (e.g. picked with prefix o) get the dev
# layout: 1 nvim, 2 the AI TUI below. See ~/.local/bin/tmux-dev-layout.
set -g @dev-ai-command 'claude --ide'  # --ide: connect to this session's Neovim (claudecode.nvim)
set-hook -g session-created 'run-shell -b "~/.local/bin/tmux-dev-layout #{q:hook_session_name}"'

# ── Plugins ─────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-sessionx'

# continuum: save every 15 min and restore the last state when tmux starts.
set -g @continuum-restore 'on'

# sessionx: prefix o
set -g @sessionx-bind 'o'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths "$HOME/Projects"
set -g @sessionx-custom-paths-subdirectories 'true'  # list each repo under ~/Projects
set -g @sessionx-x-path "$HOME/.config"
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'

# ── Theme ───────────────────────────────────────────────────────────────────
# Catppuccin Mocha, same as Ghostty and Neovim. 'none' lets Ghostty's
# transparent background show through the status bar.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g status-left-length 50
set -g status-left '#{E:@catppuccin_status_session} '
set -g status-right '#{E:@catppuccin_status_directory}'

# Fresh machine: fetch TPM and install the plugins above automatically.
if 'test ! -d ~/.tmux/plugins/tpm' \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# Window pills: name + number with rounded ends. Catppuccin's own 'rounded'
# style draws its ends with reverse video, which can't be transparent, so
# these use explicit colors instead. Set after TPM to override the plugin.
set -g window-status-separator ' '
set -g window-status-current-style default  # tmux 3.8 underlines it by default
set -g window-status-format '#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #W #[fg=#{@thm_crust},bg=#{@thm_overlay_2}] #I #[fg=#{@thm_overlay_2},bg=default]'
set -g window-status-current-format '#[fg=#{@thm_surface_1},bg=default]#[fg=#{@thm_fg},bg=#{@thm_surface_1},bold] #W#{?window_zoomed_flag, 󰁌,} #[fg=#{@thm_crust},bg=#{@thm_mauve}] #I #[fg=#{@thm_mauve},bg=default,nobold]'
